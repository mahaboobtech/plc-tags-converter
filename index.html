<body>

    <div class="container">

        ```
        <div class="logo">⚡</div>

        <h1>Control Expert → PI Studio</h1>

        <div class="subtitle">
            Smart PLC variable converter
        </div>

        <!-- Upload Area -->
        <div class="drop-zone" id="dropZone">

            <div class="upload-icon">📂</div>

            <h3>Drag & Drop your Excel file</h3>

            <p>or select a Control Expert variables file from your computer</p>

            <label for="excelFile" class="browse-button">
                Browse File
            </label>

            <input type="file" id="excelFile" accept=".xlsx,.xls">

            <div class="file-name" id="fileName"></div>

        </div>

        <!-- Status Area -->
        <div id="status" class="status"></div>

        <div class="footer">
            Local Processing <span>•</span> No Server Upload <span>•</span> PI Studio Ready
        </div>
        ```

    </div>

    <script>

        const fileInput = document.getElementById("excelFile");
        const dropZone = document.getElementById("dropZone");
        const statusBox = document.getElementById("status");
        const fileNameBox = document.getElementById("fileName");


        // ============================================
        // FILE SELECTION
        // ============================================

        fileInput.addEventListener("change", function () {

            if (this.files.length) {
                handleFile(this.files[0]);
            }

        });


        // ============================================
        // DRAG AND DROP
        // ============================================

        ["dragenter", "dragover"].forEach(eventName => {

            dropZone.addEventListener(eventName, function (event) {
                event.preventDefault();
                dropZone.classList.add("dragover");
            });

        });


        ["dragleave", "drop"].forEach(eventName => {

            dropZone.addEventListener(eventName, function (event) {
                event.preventDefault();
                dropZone.classList.remove("dragover");
            });

        });


        dropZone.addEventListener("drop", function (event) {

            const file = event.dataTransfer.files[0];

            if (file) {
                handleFile(file);
            }

        });


        // ============================================
        // HANDLE SELECTED FILE
        // ============================================

        function handleFile(file) {

            const validExtensions = /\.(xlsx|xls)$/i;

            if (!validExtensions.test(file.name)) {

                showStatus(
                    "⚠ Please select a valid Excel file (.xlsx or .xls).",
                    "error"
                );

                return;
            }

            fileNameBox.textContent = "Selected: " + file.name;

            convertExcel(file);

        }


        // ============================================
        // SHOW STATUS
        // ============================================

        function showStatus(message, type) {

            statusBox.className = "status show " + type;
            statusBox.innerHTML = message;

        }


        // ============================================
        // GET SORT VALUE FROM MODBUS ADDRESS
        // ============================================

        function getSortValue(address) {

            // %M100
            const bitMatch = address.match(/^%M(\d+)$/i);

            if (bitMatch) {
                return parseFloat(bitMatch[1]);
            }


            // %MW567 or %MW567.3
            const wordMatch = address.match(/^%MW(\d+)(?:\.(\d+))?$/i);

            if (wordMatch) {

                const word = parseInt(wordMatch[1], 10);

                // Decimal addresses are sorted immediately after
                // their corresponding word address
                const decimal = wordMatch[2]
                    ? parseFloat("0." + wordMatch[2])
                    : 0;

                return word + decimal;
            }


            return Number.MAX_SAFE_INTEGER;

        }


        // ============================================
        // MAIN CONVERSION
        // ============================================

        async function convertExcel(file) {

            try {

                showStatus(
                    '<span class="spinner"></span> Reading and converting your Excel file...',
                    "processing"
                );

                await new Promise(resolve => setTimeout(resolve, 250));


                // Read source file
                const buffer = await file.arrayBuffer();

                const workbook = XLSX.read(buffer, {
                    type: "array"
                });


                // Read first sheet
                const worksheet =
                    workbook.Sheets[workbook.SheetNames[0]];


                const rows =
                    XLSX.utils.sheet_to_json(
                        worksheet,
                        {
                            defval: ""
                        }
                    );


                const convertedTags = [];
                let skippedCount = 0;


                // ========================================
                // CONVERT CONTROL EXPERT TAGS
                // ========================================

                rows.forEach((row, index) => {

                    const name =
                        String(row["Name"] || "").trim();

                    const sourceAddress =
                        String(row["Address"] || "")
                            .trim()
                            .toUpperCase();


                    // Skip blank name or address
                    if (!name || !sourceAddress) {
                        skippedCount++;
                        return;
                    }


                    let type = "";
                    let piAddress = "";


                    // ------------------------------------
                    // %MW567.3 → X / 4567.3
                    // IMPORTANT: Check decimal %MW first
                    // ------------------------------------
                    const mwDecimalMatch =
                        sourceAddress.match(/^%MW(\d+)\.(\d+)$/);

                    if (mwDecimalMatch) {

                        const wordNumber = mwDecimalMatch[1];
                        const bitNumber = mwDecimalMatch[2];

                        type = "X";
                        piAddress =
                            "4" + wordNumber + "." + bitNumber;

                    }


                    // ------------------------------------
                    // %MW100 → W / 4100
                    // ------------------------------------
                    else if (/^%MW\d+$/.test(sourceAddress)) {

                        const number =
                            sourceAddress.replace("%MW", "");

                        type = "W";
                        piAddress = "4" + number;

                    }


                    // ------------------------------------
                    // %M100 → X / 0100
                    // ------------------------------------
                    else if (/^%M\d+$/.test(sourceAddress)) {

                        const number =
                            sourceAddress.replace("%M", "");

                        type = "X";
                        piAddress = "0" + number;

                    }


                    // Unsupported address
                    else {

                        skippedCount++;
                        return;

                    }


                    // Store converted tag and original address
                    // for correct Modbus sorting
                    convertedTags.push({
                        name: name,
                        type: type,
                        address: piAddress,
                        originalAddress: sourceAddress,
                        originalIndex: index
                    });

                });


                // ========================================
                // SORT BY MODBUS ADDRESS
                // ========================================

                convertedTags.sort((a, b) => {

                    const aValue =
                        getSortValue(a.originalAddress);

                    const bValue =
                        getSortValue(b.originalAddress);


                    // Primary sorting by address
                    if (aValue !== bValue) {
                        return aValue - bValue;
                    }


                    // Keep original order if addresses are equal
                    return a.originalIndex - b.originalIndex;

                });


                // ========================================
                // CREATE OUTPUT DATA
                // ========================================

                const outputData = convertedTags.map(tag => ({
                    "Name": tag.name,
                    "Type": tag.type,
                    "Address": tag.address,
                    "ByteOrder": "0",
                    "Extend1": "0",
                    "Extend2": "0"
                }));


                // ========================================
                // CREATE PI STUDIO WORKBOOK
                // ========================================

                const outputWorkbook =
                    XLSX.utils.book_new();


                const outputWorksheet =
                    XLSX.utils.json_to_sheet(
                        outputData,
                        {
                            header: [
                                "Name",
                                "Type",
                                "Address",
                                "ByteOrder",
                                "Extend1",
                                "Extend2"
                            ]
                        }
                    );


                // Force every cell to TEXT
                Object.keys(outputWorksheet).forEach(
                    cellAddress => {

                        if (cellAddress.startsWith("!")) return;

                        const cell =
                            outputWorksheet[cellAddress];

                        cell.t = "s";
                        cell.v = String(cell.v ?? "");
                        cell.z = "@";

                    }
                );


                // Set reasonable column widths
                outputWorksheet["!cols"] = [
                    { wch: 40 },
                    { wch: 10 },
                    { wch: 16 },
                    { wch: 12 },
                    { wch: 12 },
                    { wch: 12 }
                ];


                // PI Studio required sheet name
                XLSX.utils.book_append_sheet(
                    outputWorkbook,
                    outputWorksheet,
                    "DSO_DX"
                );


                // ========================================
                // AUTOMATIC DOWNLOAD AS XLS
                // ========================================

                XLSX.writeFile(
                    outputWorkbook,
                    "PI_Studio_Converted.xls",
                    {
                        bookType: "biff8"
                    }
                );


                // ========================================
                // SUCCESS MESSAGE
                // ========================================

                showStatus(
                    "✓ Conversion Complete!<br><br>" +
                    "<strong>" + outputData.length +
                    "</strong> tags converted &nbsp;•&nbsp; " +
                    "<strong>" + skippedCount +
                    "</strong> skipped<br><br>" +
                    "Your PI Studio file has been downloaded automatically.",
                    "success"
                );

            }
            catch (error) {

                console.error(error);

                showStatus(
                    "⚠ Conversion failed<br><br>" +
                    error.message,
                    "error"
                );

            }

        }

    </script>
